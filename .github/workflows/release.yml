name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # macOS：固定 macos-26（arm64 runner），同时打 Intel(x64) + Apple Silicon(arm64)
  build-mac:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Package (mac x64 + arm64)
        run: npm run build && npx electron-builder --mac --x64 --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 有证书时去掉下面这行，填入 CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID 等 Secrets
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
          # 安装包未签名，在 Release 页面附上 macOS 安装说明
          body: |
            ## macOS 安装说明

            安装包暂未经过 Apple 签名和公证，从浏览器下载后首次打开会提示「无法打开"飞享IM"，因为无法验证开发者」。
            把 App 拖进「应用程序」后，在终端执行以下命令去掉隔离标记，即可正常打开：

            ```bash
            xattr -dr com.apple.quarantine "/Applications/飞享IM.app"
            ```

            也可以在 Finder 中右键点击 App →「打开」，在弹窗中再点「打开」。

      # 交给 deploy job 统一传到服务器
      - name: Upload macOS build for deploy
        uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: release/*.dmg
          retention-days: 1

  # Linux：固定 ubuntu-24.04（x64，原生编译），避免 ubuntu-latest 迁移到新版本带来的构建变化
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Package (linux x64)
        run: npm run build && npx electron-builder --linux --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux build for deploy
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 1

  # Windows：固定 windows-2025-vs2026，只打 x64（package.json 已配置）
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Package (win)
        run: npm run build && npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows build for deploy
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: release/*.exe
          retention-days: 1

  # 三个平台都编译成功后，统一传到服务器临时目录，再拷贝到 minio 目录（与 android-chat-pro 一致）
  # ssh-deploy / ssh-action 只能在 Linux runner 上运行，所以单独放一个 job
  deploy:
    runs-on: ubuntu-24.04
    needs: [build-mac, build-linux, build-windows]
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      # 统一成 minio 中固定的文件名
      - name: Normalize file names
        run: |
          set -e
          ls -l dist
          mkdir deploy
          cp dist/*-x64.exe      deploy/fshare-chat-window.exe
          cp dist/*-x64.dmg      deploy/fshare-chat-macos.dmg
          cp dist/*-arm64.dmg    deploy/fshare-chat-macos-arm64.dmg
          cp dist/*.AppImage     deploy/fshare-chat-linux.AppImage
          cp dist/*.deb          deploy/fshare-chat-linux.deb
          ls -l deploy

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: '-avzr'
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
          SOURCE: 'deploy/'
          TARGET: '/data/temp-release/'

      - name: Copy release to minio server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            for f in fshare-chat-window.exe fshare-chat-macos.dmg fshare-chat-macos-arm64.dmg fshare-chat-linux.AppImage fshare-chat-linux.deb; do
              cp -f /data/temp-release/$f /data/minio/miniodata/minio-bucket-file-name/$f
            done
            ls -l /data/minio/miniodata/minio-bucket-file-name/fshare-chat-*
